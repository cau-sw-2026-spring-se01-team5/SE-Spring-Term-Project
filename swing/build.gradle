plugins {
    id 'java'
    id 'application'
}

group = 'team5'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation project(':core')
    implementation project(':controller')
    implementation project(':mock-support')
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'app.Main'
}
