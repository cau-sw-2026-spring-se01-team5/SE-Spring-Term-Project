plugins {
    id 'java'
    id 'io.freefair.lombok' version '9.5.0'
}

group = 'team5'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation project(':controller')
}

test {
    useJUnitPlatform()
}